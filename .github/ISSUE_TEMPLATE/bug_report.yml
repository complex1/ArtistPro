name: Bug report
description: Report a reproducible problem in a tool or installer
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Version and tool
      placeholder: "0.1.0 — Drawing Canvas"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, CPU, and browser/desktop mode
      placeholder: "macOS, Apple Silicon, packaged desktop"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. Use a minimal non-sensitive example.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove personal information and credentials. Report vulnerabilities privately.
