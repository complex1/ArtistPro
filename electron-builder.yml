# electron-builder contents layout:
# https://www.electron.build/docs/contents/
appId: com.artiststudio.app
productName: Artist Studio
asar: true
npmRebuild: false
directories:
  output: release
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
files:
  - package.json
  - LICENSE
  - docs/third-party-notices.md
  - docs/third-party-licenses.json
  - docs/python-licenses.json
  - docs/licenses/**/*
  - dist/**/*
  - dist-tappilot-phone/**/*
  - apps/desktop/electron/**/*
  - apps/tappilot/electron/**/*
  - '!apps/**/electron/**/*.test.*'
extraResources:
  - from: build/backend-runtime
    to: backend-runtime
    filter:
      - '**/*'
  - from: backend
    to: python/backend
    filter:
      - '**/*'
      - '!**/test_*.py'
      - '!**/__pycache__/**'
  - from: apps
    to: python/apps
    filter:
      - '**/tool.json'
      - '**/server/**'
      - '!**/test_*.py'
      - '!**/__pycache__/**'
mac:
  category: public.app-category.graphics-design
  icon: public/artist-studio.png
  target:
    - dmg
    - zip
win:
  icon: public/artist-studio.png
  target:
    - nsis
linux:
  icon: public/artist-studio.png
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
