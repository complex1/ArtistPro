<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Animated Brush Studio</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --line: #d8dde5;
    --text: #111827;
    --muted: #6b7280;
    --active: #111827;
  }
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  button, input, select { font: inherit; }
  button, select {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 7px 10px;
  }
  button { cursor: pointer; }
  button:hover { background: #f7f8fa; }
  button.active { background: var(--active); color: #fff; border-color: var(--active); }
  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: 58px 1fr;
  }
  .toolbar {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .toolbar .spacer { flex: 1; }
  label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
  }
  input[type="range"] { width: 90px; }
  input[type="color"] {
    width: 34px;
    height: 30px;
    padding: 0;
    border: 0;
    background: none;
  }
  .workspace {
    min-height: 0;
    display: grid;
    grid-template-columns: 250px 1fr 220px;
  }
  .sidebar, .layers-panel {
    min-height: 0;
    overflow: auto;
    background: var(--panel);
  }
  .sidebar { border-right: 1px solid var(--line); padding: 12px; }
  .layers-panel { border-left: 1px solid var(--line); padding: 12px; }
  .section-title {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 8px 0 7px;
  }
  .preset-search {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  .preset-list { display: grid; gap: 6px; }
  .preset {
    text-align: left;
    width: 100%;
    display: grid;
    grid-template-columns: 10px 1fr;
    gap: 9px;
    align-items: center;
    padding: 8px 9px;
  }
  .preset.active { background: #111827; color: white; }
  .dot {
    width: 8px; height: 8px; border-radius: 999px; background: currentColor; opacity: .7;
  }
  .stage-wrap {
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    overflow: auto;
    padding: 28px;
    background:
      linear-gradient(45deg, #d9dde3 25%, transparent 25%),
      linear-gradient(-45deg, #d9dde3 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #d9dde3 75%),
      linear-gradient(-45deg, transparent 75%, #d9dde3 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
  }
  #displayCanvas {
    width: min(900px, 100%);
    height: auto;
    background: white;
    box-shadow: 0 12px 38px rgba(0,0,0,.17);
    touch-action: none;
  }
  .panel-row { display: flex; gap: 6px; align-items: center; }
  .panel-row button { flex: 1; }
  .layer-list {
    display: flex;
    flex-direction: column-reverse;
    gap: 7px;
    margin-top: 10px;
  }
  .layer {
    display: grid;
    grid-template-columns: 26px 1fr 28px;
    gap: 7px;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    cursor: pointer;
  }
  .layer.active { border-color: #111827; background: #f7f8fa; }
  .layer-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px;
  }
  .mini {
    border: 0;
    padding: 2px;
    background: transparent;
  }
  .stats, .hint {
    font-size: 12px;
    line-height: 1.45;
    color: var(--muted);
    margin-top: 12px;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 999px;
    background: #eef0f3;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <button id="brushTool" class="active">Brush</button>
    <button id="eraserTool">Eraser</button>

    <label>Color <input id="color" type="color" value="#111111"></label>
    <label>Size <input id="size" type="range" min="1" max="80" value="9"><span id="sizeOut">9</span></label>
    <label>Motion <input id="motion" type="range" min="0" max="30" value="9"><span id="motionOut">9</span></label>
    <label>Speed <input id="speed" type="range" min="1" max="10" value="5"><span id="speedOut">5</span></label>

    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="clear">Clear Layer</button>

    <div class="spacer"></div>
    <button id="export">Export PNG</button>
  </div>

  <div class="workspace">
    <aside class="sidebar">
      <input id="presetSearch" class="preset-search" placeholder="Search brushes…" />
      <div id="presetGroups"></div>
    </aside>

    <main class="stage-wrap">
      <canvas id="displayCanvas" width="900" height="600"></canvas>
    </main>

    <aside class="layers-panel">
      <div class="panel-row">
        <strong style="flex:1">Layers</strong>
        <button id="addLayer">+ Layer</button>
      </div>
      <div id="layerList" class="layer-list"></div>
      <div id="stats" class="stats"></div>
      <div class="hint">
        Animated strokes are stored as point data and rendered every frame.
        Raster brush strokes remain baked into the active layer.
      </div>
    </aside>
  </div>
</div>
<script src="./app.js"></script>
</body>
</html>
