<!doctype html>
<meta charset="utf-8"><title>Paint renderer checks</title>
<style>body{font:14px system-ui;padding:20px}canvas{width:400px;height:300px;border:1px solid #ccc}pre{white-space:pre-wrap}button{padding:12px}</style>
<h1>Paint renderer checks</h1>
<p>Finite synthetic checks. Left: accurate Canvas2D. Right: GPU preview / worker output. No saved project is changed.</p>
<button id="run">Run renderer checks</button><p id="status">Ready</p>
<canvas id="reference" width="800" height="600"></canvas><canvas id="output" width="800" height="600"></canvas><pre id="results"></pre>
<script type="module">
import {createDocumentV2,emptyPoint} from '/apps/animated-paint/web/paint/v2/core/defaults.ts';
import {getBuiltinBrush} from '/apps/animated-paint/web/paint/v2/presets.ts';
import {snapshotStroke} from '/apps/animated-paint/web/paint/v2/input/sampler.ts';
import {renderDocumentV2,clearStrokeCache,releaseRenderCache} from '/apps/animated-paint/web/paint/v2/render/engine.ts';
import {createGpuRenderer} from '/apps/animated-paint/web/paint/v2/render/gpu.ts';
import {unzipSync} from 'fflate';
import {renderPaintDocument} from '/apps/animated-paint/web/paint/v2/render/exportEngine.ts';
import {registerStampImage} from '/apps/animated-paint/web/paint/v2/render/canvas2d.ts';
import {PaintPreviewHost} from '/apps/animated-paint/web/paint/v2/render/previewHost.ts';
const reference=document.querySelector('#reference'), output=document.querySelector('#output'), status=document.querySelector('#status'), results=document.querySelector('#results'), button=document.querySelector('#run');
const a=reference.getContext('2d',{willReadFrequently:true}), b=output.getContext('2d',{willReadFrequently:true});
const median = v=>v.toSorted((a,b)=>a-b)[Math.floor(v.length/2)];
const round=v=>Math.round(v*100)/100;
function scene(id,count) {
 const doc=createDocumentV2('Synthetic',800,600), layer=doc.layers[0],brush=getBuiltinBrush(id);
 layer.strokes=Array.from({length:count},(_,s)=>snapshotStroke(brush,Array.from({length:160},(_,i)=>({...emptyPoint(40+i*3+(s%5)*30,90+(s%10)*38+45*Math.sin(i*.07+s*.13),i*.01),pressure:.5+.25*Math.sin(i*.03)})),layer.id,s+1));
 return doc;
}
function compare() {
 const x=a.getImageData(0,0,800,600).data,y=b.getImageData(0,0,800,600).data;
 let sum=0,changed=0,max=0;
 for(let i=0;i<x.length;i+=4) {
  let difference=0;
  for(let c=0;c<4;c++){let d=Math.abs(x[i+c]-y[i+c]);sum+=d;max=Math.max(max,d);difference=Math.max(difference,d);}
  if(difference>10)changed++;
 }
 return {meanChannelError:round(sum/x.length),pixelsOver10:round(changed/(800*600)*100),max};
}
button.onclick=async()=>{
 button.disabled=true; const report={gpu:[],worker:[],checks:[]}; let gpu=createGpuRenderer(),host;
 results.textContent='';
 try {
 for(const [id,count] of [['graphiteCrawl',50],['dryBristle',50],['inkBloom',50],['boil',50]]) {
  status.textContent=`Measuring changed frames: ${id}`;
  const doc=scene(id,count), cpu=[], accelerated=[]; let held,changed;
  for(let frame=0;frame<8;frame++) {
   await new Promise(resolve=>setTimeout(resolve,20));
   const time=5000+frame*200; const before=gpu.batches;
   let start=performance.now();const stats=renderDocumentV2(a,doc,time,new Map()); const accurate=performance.now()-start;
   start=performance.now(); renderDocumentV2(b,doc,time,new Map(),undefined,gpu); const fast=performance.now()-start;
   if(frame>1){cpu.push(accurate); accelerated.push(fast);}
   changed={accurate,fast,items:stats.itemCount,batches:gpu.batches-before};
   start=performance.now(); renderDocumentV2(a,doc,time,new Map()); held=performance.now()-start;
  }
  const visual=compare(); report.gpu.push({brush:id,strokes:count,marks:changed.items,changedFrameCanvasMs:round(median(cpu)),changedFrameGpuMs:round(median(accelerated)),heldFrameMs:round(held),batches:changed.batches,visual});
  if(id==='boil' && visual.max!==0) throw new Error('Line fallback differs');
  if(id!=='boil' && (visual.meanChannelError>8 || visual.pixelsOver10>25)) throw new Error('GPU preview exceeded visual tolerance');
  results.textContent=JSON.stringify(report,null,2);clearStrokeCache();
 }
 status.textContent='Checking worker scene edits, masks, and queue';
 let resolveFrame,rejectFrame;
 host=new PaintPreviewHost(output,{invalidate(){},error(message){rejectFrame?.(new Error(message));},painted(stats,threaded,gpuBatches){resolveFrame?.({stats,threaded,gpuBatches});}});
 if(!host.threaded)throw new Error('Worker unavailable in test browser');
 const doc=scene('graphiteCrawl',10), rasters=new Map(), masks=new Map();
 const mask=document.createElement('canvas');mask.width=800;mask.height=600;mask.getContext('2d').fillRect(100,0,90,600);masks.set(doc.layers[0].id,mask);
 doc.layers[0].opacity=.55;
 let version=0;
 async function frame(gpu=false,burst=false) {
  const waiting=new Promise((resolve,reject)=>{resolveFrame=resolve;rejectFrame=reject});
  const start=performance.now();
  for(let i=0;i<(burst?30:1);i++)host.request({document:doc,surfaces:{rasters,masks},time:5000,now:5000,version:++version,gpu});
  const result=await waiting;renderDocumentV2(a,doc,5000,rasters,masks,undefined,5000);
  const visual=compare();if(!gpu && visual.max!==0)throw new Error(`Worker mismatch ${JSON.stringify(visual)}`);
  return {threaded:result.threaded,workerCpuMs:round(result.stats.totalMs),roundTripMs:round(performance.now()-start),gpuBatches:result.gpuBatches,visual};
 }
 report.worker.push({case:'masked layer opacity',...await frame()});
 masks.clear();report.worker.push({case:'undo eraser mask',...await frame()});
 doc.layers[0].strokes[0].points.push(emptyPoint(600,500,2));report.worker.push({case:'appended points and burst queue',...await frame(false,true)});
 const removed=doc.layers[0].strokes.pop();report.worker.push({case:'delete stroke',...await frame()});
 doc.layers[0].strokes.push(removed);report.worker.push({case:'undo stroke deletion',...await frame()});
 report.worker.push({case:'GPU in worker',...await frame(true)});
 const stamp=document.createElement('canvas');stamp.width=32;stamp.height=16;
 const stampContext=stamp.getContext('2d');stampContext.fillStyle='#aaff44';stampContext.fillRect(0,0,16,16);stampContext.fillStyle='#7733ff';stampContext.fillRect(16,0,16,16);
 const src=stamp.toDataURL();registerStampImage(src,await createImageBitmap(stamp));
 const imageBrush=getBuiltinBrush('round');imageBrush.stamps=[src];imageBrush.size=24;
 doc.layers[0].strokes=[snapshotStroke(imageBrush,[emptyPoint(40,40),emptyPoint(650,400)],doc.layers[0].id,1)];
 report.worker.push({case:'image stamp',...await frame()});
 doc.layers[0].strokes[0]={...doc.layers[0].strokes[0],brushSnapshot:{...imageBrush,stamps:['shape:'+src],color:'#ee4433'}};
 report.worker.push({case:'tinted shape stamp',...await frame()});
 
 status.textContent='Checking deterministic PNG export and backward seeks';
 const exportDoc=scene('inkBloom',2);
 const artifact=await renderPaintDocument(exportDoc,{rasters:new Map(),masks:new Map()},{format:'image-sequence',fps:12,duration:.5});
 const zip=unzipSync(new Uint8Array(await artifact.blob.arrayBuffer()));
 const filenames=Object.keys(zip).sort();
 if(filenames.length!==6)throw new Error('Unexpected PNG frame count');
 for(const i of [0,5,0]) {
  const bitmap=await createImageBitmap(new Blob([zip[filenames[i]]],{type:'image/png'}));
  b.clearRect(0,0,800,600);b.drawImage(bitmap,0,0);bitmap.close();
  renderDocumentV2(a,exportDoc,i/12*1000,new Map());
  if(compare().max!==0)throw new Error('Export pixels differ after seek');
 }
 report.export={format:'PNG sequence',frames:filenames.length,bytes:artifact.blob.size,firstLastAndBackwardSeek:'exact pixels'};
 report.checks.push('Line fallback exact','Worker accurate pixels exact','Mask removal applied','Stroke append/delete/undo applied','Burst queue reaches latest revision');
 results.textContent=JSON.stringify(report,null,2);status.textContent='PASS — finite renderer checks complete';
 }catch(error){status.textContent=`FAIL: ${error.message}`;results.textContent=JSON.stringify(report,null,2)}
 finally{host?.dispose();gpu.dispose();releaseRenderCache(a);releaseRenderCache(b);button.disabled=false;}
};
</script>
