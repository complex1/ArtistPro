<!doctype html>
<meta charset="utf-8">
<title>Animated Paint render benchmark</title>
<style>body{font:15px system-ui;margin:24px;background:#f5f5f3;color:#202624}button{padding:10px}pre{white-space:pre-wrap}canvas{width:400px;height:300px;border:1px solid #ccc}</style>
<h1>Animated Paint render benchmark</h1>
<p>Finite synthetic cases using the current stroke pipeline on an 800 × 600 canvas. No project data is changed. Timings cover CPU generation and Canvas2D command submission, not GPU completion or display FPS.</p>
<button id="run">Run bounded benchmark</button>
<p id="status">Ready</p>
<canvas id="preview" width="800" height="600"></canvas>
<pre id="results"></pre>
<script type="module">
import { createDocumentV2, emptyPoint } from '/apps/animated-paint/web/paint/v2/core/defaults.ts';
import { getBuiltinBrush } from '/apps/animated-paint/web/paint/v2/presets.ts';
import { snapshotStroke } from '/apps/animated-paint/web/paint/v2/input/sampler.ts';
import { renderDocumentV2, clearStrokeCache } from '/apps/animated-paint/web/paint/v2/render/engine.ts';
import { canvas2dRenderer } from '/apps/animated-paint/web/paint/v2/render/canvas2d.ts';
const canvas = document.querySelector('canvas');
const context = canvas.getContext('2d');
const output = document.querySelector('#results');
const status = document.querySelector('#status');
const button = document.querySelector('button');
const median = values => values.toSorted((a,b) => a-b)[Math.floor(values.length/2)];
const round = value => Math.round(value*100)/100;
button.onclick = async () => {
  button.disabled = true;
  const result = { browser: navigator.userAgent, logicalCores: navigator.hardwareConcurrency,
    offscreenCanvas: typeof OffscreenCanvas === 'function', worker: typeof Worker === 'function',
    crossOriginIsolated, sharedArrayBuffer: typeof SharedArrayBuffer === 'function', cases: [] };
  output.textContent = JSON.stringify(result, null, 2);
  try {
    for (const [id, count] of [['round',50], ['boil',50], ['graphiteCrawl',10], ['graphiteCrawl',50], ['dryBristle',50], ['inkBloom',50], ['rainbow',20]]) {
      status.textContent = `Measuring ${count} ${id} strokes`;
      const doc = createDocumentV2('Synthetic',800,600);
      const layer = doc.layers[0];
      const brush = getBuiltinBrush(id);
      layer.strokes = Array.from({length:count}, (_,s) => snapshotStroke(brush,
        Array.from({length:160},(_,i)=>({...emptyPoint(40+i*3+(s%5)*30,90+(s%10)*38+45*Math.sin(i*.07+s*.13),i*.01),pressure:.5+.25*Math.sin(i*.03)})),layer.id,s+1));
      const rasters = new Map();
      const durations=[], paintTimes=[], animTimes=[];
      let coldFrameMs = 0
      let itemCount = 0
      let paintMs = 0
      const renderer = {paint(ctx,items,stamps) { const start=performance.now(); canvas2dRenderer.paint(ctx,items,stamps); paintMs+=performance.now()-start; }};;
      for (let frame = 0; frame < 8; frame++) {
        await new Promise(resolve => setTimeout(resolve, 25));
        paintMs=0;
        const start=performance.now();
        const stats=renderDocumentV2(context,doc,5000+frame*16.667,rasters,undefined,renderer);
        const totalMs=performance.now()-start;
        itemCount=stats.itemCount;
        if(frame===0) coldFrameMs=totalMs;
        if(frame>=2) { durations.push(totalMs); paintTimes.push(paintMs); animTimes.push(stats.animationMs); }
      }
      result.cases.push({brush:brush.name,strokes:count,itemsPerFrame:itemCount,
        medianCpuFrameMs:round(median(durations)),medianCanvasSubmissionMs:round(median(paintTimes)),
        medianScriptOnlyMs:round(median(animTimes)),unusedPackedMBNowAvoidedPerFrame:round(itemCount*21*4/1e6),coldFrameMs:round(coldFrameMs),maxMeasuredFrameMs:round(Math.max(...durations))});
      output.textContent=JSON.stringify(result,null,2);
      clearStrokeCache();
    }
    status.textContent='Complete — CPU submission timings; GPU completion and temperature are not measured.';
  } catch(error) { status.textContent=String(error); }
  button.disabled = false;
};
</script>
