services:
  studio:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8765:8765"
    volumes:
      - artist-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  artist-data:
